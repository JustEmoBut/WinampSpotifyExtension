name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add i686-pc-windows-msvc
      - id: rustc
        shell: bash
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Restore only: the cache is filled by ci.yml on main (same key scheme).
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
      # --locked keeps the vergen 9.0.6 pin from Cargo.lock (see CLAUDE.md).
      - run: cargo test --release --locked --workspace
      - run: cargo build --release --locked --workspace
      # One flat zip: install.ps1 finds the DLLs next to itself after extraction.
      - name: Package
        shell: pwsh
        run: |
          $files = 'target/i686-pc-windows-msvc/release/in_spotitube.dll', 'target/i686-pc-windows-msvc/release/ml_spotitube.dll', 'install.ps1', 'install.bat'
          Compress-Archive -Path $files -DestinationPath "SpotiTube-${{ github.ref_name }}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "SpotiTube-${{ github.ref_name }}.zip" --generate-notes
