name: CI

# Runs the tests on main and fills the build cache that tag releases restore
# (a tag can only read caches saved on the default branch).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add i686-pc-windows-msvc
      - id: rustc
        shell: bash
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Keyed on Cargo.lock and the compiler: a new rustc invalidates every artifact anyway.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
      # --locked keeps the vergen 9.0.6 pin from Cargo.lock (see CLAUDE.md).
      - run: cargo test --release --locked --workspace
